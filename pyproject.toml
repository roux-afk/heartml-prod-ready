[project]
name = "heart-disease"
version = "0.1.0"
description = "Heart disease prediction (production refactor)"
authors = [
    {name = "roux-afk",email = "52426386+roux-afk@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "xgboost (>=3.4.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pandas-stubs (>=3.0.5.260914,<4.0.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.poetry]
packages = [{ include = "heart_disease", from = "src" }]